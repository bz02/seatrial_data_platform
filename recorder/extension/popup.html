<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:13px system-ui,sans-serif;width:280px;margin:12px;color:#1d2433}
h1{font-size:15px;margin:0 0 8px}label{display:block;margin:8px 0 2px;color:#5b6475}
input{width:100%;box-sizing:border-box;padding:6px;border:1px solid #c9d0db;border-radius:6px}
button{margin-top:10px;width:100%;padding:7px;border:0;border-radius:6px;background:#0f766e;color:#fff;cursor:pointer}
p{color:#5b6475;font-size:12px}
</style></head><body>
<h1>SeaTrail recorder</h1>
<p>Get your capture token from your company's SeaTrail page after you consent to recording.</p>
<label for="api">Company SeaTrail server</label><input id="api" placeholder="https://seatrail.yourcompany.com">
<label for="tok">Capture token</label><input id="tok" type="password">
<button id="save">Save</button><p id="msg"></p>
<script src="popup.js"></script>
</body></html>
