# Fly.io: fly launch --no-deploy --copy-config, then
#   fly volumes create seatrail_data --size 1
#   fly secrets set SEATRAIL_SECRET_KEY=... ANTHROPIC_API_KEY=...
#   fly deploy
app = "seatrial"
primary_region = "sjc"

[build]

[env]
  SEATRAIL_DEMO_MODE = "true"
  SEATRAIL_COOKIE_SECURE = "true"
  SEATRAIL_DATA_DIR = "/data"
  PORT = "8000"

[mounts]
  source = "seatrail_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
