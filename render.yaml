# Render blueprint: New > Blueprint, point at this repo. Uses a persistent disk for SQLite.
services:
  - type: web
    name: seatrial
    runtime: docker
    plan: starter
    domains:
      - data.seatrial.ai
    healthCheckPath: /healthz
    disk:
      name: seatrial-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SEATRAIL_DEMO_MODE
        value: "true"
      - key: SEATRAIL_COOKIE_SECURE
        value: "true"
      - key: SEATRAIL_SECRET_KEY
        generateValue: true
      - key: SEATRAIL_PUBLIC_URL
        value: https://data.seatrial.ai
      - key: ANTHROPIC_API_KEY
        sync: false
